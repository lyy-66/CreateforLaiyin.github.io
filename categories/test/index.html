                    <button onclick="nextMusic(); event.stopPropagation();" style="border: none; background: transparent; color: var(--text-color); cursor: pointer; font-size: 11px;">下曲→</button>

        <script>
            
            const musicList = [
                 { src: "/CreateforLaiyin.github.io/audio/song1.mp3", title: "song1" },
                 { src: "/CreateforLaiyin.github.io/audio/song2.mp3", title: "song2" },
                 { src: "/CreateforLaiyin.github.io/audio/song3.mp3", title: "song3" },
            ];

            
            const audio = document.getElementById('bg-music');
            const titleEl = document.getElementById('music-title');
            const playBtn = document.getElementById('play-btn');
            const volumeControl = document.getElementById('volume-control');
            const playerContainer = document.getElementById('global-music-player');
            const playerControls = document.getElementById('player-controls');
            const minimizeBtn = document.getElementById('minimize-btn');
            
            const musicListModal = document.getElementById('music-list-modal');
            const musicListContainer = document.getElementById('music-list-container');
            
            const progressBar = document.getElementById('progress-bar');
            const currentTimeEl = document.getElementById('current-time');
            const totalTimeEl = document.getElementById('total-time');
            
            
            let currentTrack = 0;
            let isExpanded = false;
            let isListShow = false; 
            audio.volume = 0.3;
            let isDraggingProgress = false; 

            
            const STORAGE = {
                TRACK: 'blog_music_current_track',
                TIME: 'blog_music_play_time',
                PLAYING: 'blog_music_is_playing',
                VOLUME: 'blog_music_volume'
            };

            
            function formatTime(seconds) {
                if (isNaN(seconds)) return '00:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }

            
            function updateProgressBar() {
                if (isDraggingProgress) return; 
                if (audio.duration) {
                    const progress = (audio.currentTime / audio.duration) * 100;
                    progressBar.value = progress;
                    currentTimeEl.textContent = formatTime(audio.currentTime);
                }
            }

            
            function setAudioProgress() {
                if (!audio.duration) return;
                const progress = parseFloat(progressBar.value);
                const newTime = (progress / 100) * audio.duration;
                audio.currentTime = newTime;
                currentTimeEl.textContent = formatTime(newTime);
                saveAllState(); 
            }

            
            function initMusicList() {
                musicListContainer.innerHTML = '';
                musicList.forEach((item, index) => {
                    const listItem = document.createElement('div');
                    listItem.style = `
                        padding: 4px 8px;
                        border-radius: 4px;
                        color: var(--text-color);
                        font-size: 11px;
                        cursor: pointer;
                        transition: background 0.2s;
                    `;
                    
                    if (index === currentTrack) {
                        listItem.style.background = 'var(--link-color)';
                        listItem.style.color = '#fff';
                    }
                    listItem.innerHTML = `${index + 1}. ${item.title}`;
                    
                    listItem.onclick = function() {
                        selectMusic(index);
                        toggleMusicList(); 
                    };
                    musicListContainer.appendChild(listItem);
                });
            }

            
            function toggleMusicList() {
                isListShow = !isListShow;
                musicListModal.style.display = isListShow ? 'block' : 'none';
                if (isListShow) {
                    initMusicList(); 
                }
            }

            
            function selectMusic(index) {
                currentTrack = index;
                audio.src = musicList[currentTrack].src;
                audio.currentTime = 0; 
                audio.play();
                playBtn.innerHTML = '⏸️ 暂停';
                titleEl.textContent = `正在播放：${musicList[currentTrack].title}`;
                updateMinimizeBtn();
                saveAllState();
                initMusicList(); 
                
                progressBar.value = 0;
                currentTimeEl.textContent = '00:00';
            }

            
            function togglePlayer() {
                isExpanded = !isExpanded;
                playerControls.style.display = isExpanded ? 'block' : 'none';
                
                if (musicListModal.style.display === 'block') {
                    toggleMusicList();
                }
                updateMinimizeBtn();
            }

            
            function updateMinimizeBtn() {
                const statusIcon = audio.paused ? '▶️' : '⏸️';
                minimizeBtn.innerHTML = `${statusIcon} ${musicList[currentTrack].title}`;
            }

            
            function saveAllState() {
                localStorage.setItem(STORAGE.TRACK, currentTrack);
                localStorage.setItem(STORAGE.TIME, audio.currentTime); 
                localStorage.setItem(STORAGE.PLAYING, !audio.paused);
                localStorage.setItem(STORAGE.VOLUME, audio.volume);
            }

            
            function restoreAllState() {
                
                const savedTrack = localStorage.getItem(STORAGE.TRACK);
                if (savedTrack !== null) {
                    currentTrack = parseInt(savedTrack);
                    
                    currentTrack = Math.max(0, Math.min(currentTrack, musicList.length - 1));
                }

                
                const savedTime = localStorage.getItem(STORAGE.TIME);
                const playTime = savedTime !== null ? parseFloat(savedTime) : 0;

                
                const savedVolume = localStorage.getItem(STORAGE.VOLUME);
                if (savedVolume !== null) {
                    audio.volume = parseFloat(savedVolume);
                    volumeControl.value = audio.volume;
                }

                
                audio.src = musicList[currentTrack].src;
                audio.currentTime = playTime; 
                titleEl.textContent = `正在播放：${musicList[currentTrack].title}`;
                updateMinimizeBtn();
                initMusicList(); 

                
                const isPlaying = localStorage.getItem(STORAGE.PLAYING) === 'true';
                if (isPlaying) {
                    
                    audio.play().then(() => {
                        playBtn.innerHTML = '⏸️ 暂停';
                        updateMinimizeBtn();
                    }).catch(err => {
                        console.log('自动播放需手动触发（浏览器安全策略）：', err);
                        playBtn.innerHTML = '▶️ 播放';
                    });
                } else {
                    playBtn.innerHTML = '▶️ 播放';
                }
            }

            
            function togglePlay() {
                if (audio.paused) {
                    audio.play();
                    playBtn.innerHTML = '⏸️ 暂停';
                } else {
                    audio.pause();
                    playBtn.innerHTML = '▶️ 播放';
                }
                updateMinimizeBtn();
                saveAllState();
            }

            
            function prevMusic() {
                currentTrack = (currentTrack - 1 + musicList.length) % musicList.length;
                audio.src = musicList[currentTrack].src;
                audio.currentTime = 0; 
                audio.play();
                playBtn.innerHTML = '⏸️ 暂停';
                titleEl.textContent = `正在播放：${musicList[currentTrack].title}`;
                updateMinimizeBtn();
                saveAllState();
                initMusicList(); 
                
                progressBar.value = 0;
                currentTimeEl.textContent = '00:00';
            }

            
            function nextMusic() {
                currentTrack = (currentTrack + 1) % musicList.length;
                audio.src = musicList[currentTrack].src;
                audio.currentTime = 0; 
                audio.play();
                playBtn.innerHTML = '⏸️ 暂停';
                titleEl.textContent = `正在播放：${musicList[currentTrack].title}`;
                updateMinimizeBtn();
                saveAllState();
                initMusicList(); 
                
                progressBar.value = 0;
                currentTimeEl.textContent = '00:00';
            }

            
            volumeControl.addEventListener('input', function() {
                audio.volume = this.value;
                saveAllState();
            });

            
            audio.addEventListener('ended', nextMusic);

            
            let saveTimer = null;
            audio.addEventListener('timeupdate', function() {
                
                updateProgressBar();
                
                clearTimeout(saveTimer);
                saveTimer = setTimeout(saveAllState, 300);
            });

            
            audio.addEventListener('loadedmetadata', function() {
                totalTimeEl.textContent = formatTime(audio.duration);
                updateProgressBar();
            });

            
            
            progressBar.addEventListener('mousedown', function() {
                isDraggingProgress = true;
            });
            
            document.addEventListener('mouseup', function() {
                if (isDraggingProgress) {
                    isDraggingProgress = false;
                    setAudioProgress();
                }
            });
            
            progressBar.addEventListener('input', function() {
                if (!isDraggingProgress) {
                    setAudioProgress();
                }
            });
            
            progressBar.addEventListener('click', function(e) {
                e.stopPropagation();
            });

            
            window.addEventListener('beforeunload', saveAllState);

            
            document.addEventListener('click', function(e) {
                if (isListShow && 
                    !musicListModal.contains(e.target) && 
                    !playerContainer.contains(e.target)) {
                    toggleMusicList();
                }
            });

            
            playerContainer.addEventListener('click', togglePlayer);
            audio.addEventListener('play', saveAllState);
            audio.addEventListener('pause', saveAllState);

            
            document.addEventListener('DOMContentLoaded', function() {
                restoreAllState();
            });
        </script>
